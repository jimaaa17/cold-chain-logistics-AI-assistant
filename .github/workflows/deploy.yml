name: Cold Chain Logistics AI Assistant - CI & Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'FDE-YT-Cold'

jobs:
  ci-verify:
    name: Backend (FastAPI) & Frontend (React) CI Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend & FastAPI Contract Test Suite
        env:
          PYTHONPATH: BE:.
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install, Test, and Build Frontend (FE/)
        working-directory: FE
        run: |
          npm ci
          npm test
          npm run build

  deploy:
    name: Deploy to EC2 via SSH
    needs: ci-verify
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/cold-chain-logistics-FDE-Project
            git pull origin main
            source venv/bin/activate
            pip install -r requirements.txt
            if [ -d "FE" ] && command -v npm >/dev/null 2>&1; then
              cd FE && npm install && npm run build && cd ..
            fi
            sudo systemctl restart fde-api || true
            sudo systemctl restart streamlit || true