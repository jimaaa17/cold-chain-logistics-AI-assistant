name: Cold Chain Logistics AI Assistant - CI & Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'FDE-YT-Cold'

jobs:
  ci-verify:
    name: Backend (FastAPI) & Frontend (React) CI Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend & FastAPI Contract Test Suite
        env:
          PYTHONPATH: BE:.
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install, Test, and Build Frontend (FE/)
        working-directory: FE
        run: |
          npm ci
          npm test
          npm run build

  deploy:
    name: Deploy to EC2 via SSH
    needs: ci-verify
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # `inputs` is empty on push events, so fall back to the environment that holds the EC2_* secrets.
    environment: ${{ inputs.environment || 'FDE-YT-Cold' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # One command per line: `set -e` ignores failures in the middle of an && chain.
            set -e
            cd /home/ubuntu/cold-chain-logistics-FDE-Project
            git pull --ff-only origin main
            source venv/bin/activate
            pip install -r requirements.txt
            command -v npm >/dev/null || { echo "npm is not installed on the server" >&2; exit 1; }
            cd FE
            npm ci
            npm run build
            cd ..
            sudo systemctl restart fde-api
            # The API loads its model before it accepts requests. Don't print service logs here: the repo is public.
            curl -fsS --max-time 10 --retry 45 --retry-delay 2 --retry-all-errors http://127.0.0.1:8000/healthz
            curl -sS --fail-with-body --max-time 60 --retry 3 --retry-delay 5 --retry-all-errors http://127.0.0.1:8000/readyz
            sudo systemctl restart streamlit || true
